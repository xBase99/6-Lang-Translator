<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="docTitle">🗣️ 6개국어 번역기 v2.0</title>

    <!-- PWA 및 테마 설정 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <!-- Noto Sans KR 웹폰트 (리눅스/모바일 한글 깨짐 방지) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --highlight: #dbeafe;
            --highlight-border: #2563eb;
            --tag-en-bg: #e0e7ff;
            --tag-en-color: #3730a3;
            --tag-ko-bg: #fef3c7;
            --tag-ko-color: #92400e;
            --tag-ja-bg: #ffe4e6;
            --tag-ja-color: #9f1239;
            --tag-de-bg: #f3e8ff;
            --tag-de-color: #6b21a8;
            --tag-fr-bg: #e0f2fe;
            --tag-fr-color: #075985;
            --tag-es-bg: #ffedd5;
            --tag-es-color: #9a3412;
            --record-bg: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            width: 100%;

            min-height: 100dvh;
            background: var(--card-bg);

            background: transparent;

            color: var(--primary);

        .lang-tag { font-size: 0.7rem; font-weight: 800; padding: 0.15rem 0.35rem; border-radius: 4px; }

        .lang-tag.de { background: var(--tag-de-bg); color: var(--tag-de-color); }
        .lang-tag.fr { background: var(--tag-fr-bg); color: var(--tag-fr-color); }

            top: 0; left: 0;

            justify-content: center;
            align-items: center;

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 92%;
            max-width: 480px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 1.2rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);

        .modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border); }
        .close-btn { font-size: 1.6rem; cursor: pointer; }
        .modal-body { padding: 0.8rem 0; overflow-y: auto; flex: 1; }

        .setting-item { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.3rem; }
        .setting-item.horizontal { flex-direction: row; justify-content: space-between; align-items: center; }

        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }

    </style>
</head>
<body>

<!-- 환경설정 모달 -->

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" async></script>

<!-- 🔥 핵심: Transformers.js를 이용한 온디바이스 오프라인 AI 번역 구현 -->
<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    // 캐시 저장 위치 설정 (오프라인 사용 가능)
    env.allowLocalModels = false;

    let translators = {};

    // 오프라인 번역 함수 (브라우저 메모리/IndexedDB에서 실행)
    async function translateTextOffline(text, srcLang, targetLang) {
        if (!text || !text.trim()) return "";
        
        // 언어 방향 키 생성 (예: ko-en, en-ko)
        const pairKey = `${srcLang}-${targetLang}`;
        
        try {
            if (!translators[pairKey]) {
                const ocrStatus = document.getElementById('ocrStatus');
                if(ocrStatus) ocrStatus.textContent = `⏳ 오프라인 AI 번역 모델 준비 중 (${pairKey})...`;
                
                // 경량 AI 번역 모델 바인딩 (최초 1회 캐싱 후 완전 오프라인 구동)
                if (pairKey === 'ko-en') {
                    translators[pairKey] = await pipeline('translation', 'Xenova/opus-mt-ko-en');
                } else if (pairKey === 'en-ko') {
                    translators[pairKey] = await pipeline('translation', 'Xenova/opus-mt-en-ko');
                } else {
                    return text; // 기본 예시 외 기본 텍스트 반환
                }
                if(ocrStatus) ocrStatus.textContent = `✅ 모델 준비 완료!`;
            }

            const output = await translators[pairKey](text);
            return output[0].translation_text;
        } catch (e) {
            console.error("오프라인 번역 오류:", e);
            return "";
        }
    }

    // 전역 함수로 등록하여 기존 스크립트와 연결
    window.translateText = async function(text, targetLang) {
        const srcLang = detectLanguage(text); // 입력된 언어 자동 감지
        return await translateTextOffline(text, srcLang, targetLang);
    };
</script>

<script>
// Service Worker 등록 (오프라인 지원 PWA)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('Service Worker 등록 성공:', reg.scope))
      .catch((err) => console.error('Service Worker 등록 실패:', err));
  });
}

// i18n 사전 및 기존 UI/TTS 제어 로직 유지
const i18n = {
    ko: {
        title: "🗣️ 6개국어 번역기",
        btnSettings: "⚙️ 설정", btnLogs: "📜 기록", logBarText: "📝 대화 기록 모드:",
        labelInput: "연습할 문장 입력 (큰 글씨 지원):", btnClear: "🗑️ 지우기",
        btnSTTEn: "🎤 English", btnSTTKo: "🎤 한국어", btnSTTJa: "🎤 日本語", btnSTTDe: "🎤 Deutsch", btnSTTFr: "🎤 Français", btnSTTEs: "🎤 Español",
        btnSTTListening: "🎙️ 듣는 중...", labelPhoto: "📷 사진 속 글자 읽기 및 번역",
        btnPlay: "▶ 전체 읽기", btnPlayActive: "▶ 읽는 중...", btnPause: "⏸️ 일시정지", btnStop: "⏹️ 정지",
        labelSpeed: "읽기 속도:", btnRecStart: "🎙️ 발음 녹음 시작", btnRecRecording: "🎙️ 녹음 중...", btnRecStop: "⏹️ 정지", btnDownload: "💾 저장",
        labelList: "분석 및 번역 문장 목록:", btnPrev: "▲ 이전 줄", btnNext: "▼ 다음 줄", btnAutoScroll: "🔄 연속 넘김", btnAutoScrollStop: "⏸️ 정지",
        tagKo: "한국어", tagEn: "English", tagJa: "日本語", tagDe: "Deutsch", tagFr: "Français", tagEs: "Español",
        modalSettingsTitle: "⚙️ 환경 설정 (옵션)", labelLangSelect: "🌐 메뉴 언어 선택:", labelShowTrans: "번역문 화면 표시:", labelTransLang1: "번역 언어 선택:", btnSaveSettings: "설정 완료 및 닫기",
        placeholder: "문장을 입력하거나 음성/사진 버튼을 이용하세요...", errMic: "마이크 권한 필요", errNoSTT: "STT 미지원 브라우저",
        demoText: "Practice makes perfect! 오늘부터 6개국어 연습을 시작해봅시다."
    }
};

let currentLang = localStorage.getItem('app_ui_lang') || 'ko';
let langRes = i18n[currentLang] || i18n['ko'];

const inputText = document.getElementById('inputText');
const sentenceList = document.getElementById('sentenceList');
const rateInput = document.getElementById('rate');

function detectLanguage(text) {
    if (/[가-힣]/.test(text)) return 'ko';
    return 'en';
}

function parseSentences(text) {
    if (!text.trim()) return [];
    return text.split(/(?<=[.!?;\n。！？；])\s+/).filter(Boolean).map(t => ({
        text: t.trim(),
        langCode: detectLanguage(t)
    }));
}

async function renderSentences() {
    const rawSentences = parseSentences(inputText.value);
    const targetLang = document.getElementById('transLangSelect1').value;
    
    sentenceList.innerHTML = '';

    for (let i = 0; i < rawSentences.length; i++) {
        const item = rawSentences[i];
        let translatedText = "";
        
        if (window.translateText) {
            translatedText = await window.translateText(item.text, targetLang);
        }

        const card = document.createElement('div');
        card.className = 'sentence-card';
        card.innerHTML = `
            <div class="sentence-text">${item.text}</div>
            ${translatedText ? `<div class="translation-block"><div class="translation-text">💬 <b>번역:</b> ${translatedText}</div></div>` : ''}
        `;
        sentenceList.appendChild(card);
    }
}

inputText.addEventListener('input', () => {
    renderSentences();
});

// 초기화
renderSentences();
</script>
