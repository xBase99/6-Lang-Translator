<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🗣️ 6개국어 실시간 대화 & 고속 번역기 PWA (v2.02 AI)</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI번역">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png">

    <!-- 글로벌 한국어/다국어 폰트 기본 적용 (미설치 기기 대응) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --my-bubble: #dbeafe;
            --partner-bubble: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans', sans-serif; }
        html, body { width: 100%; height: 100%; background-color: var(--bg); color: var(--text); }
        body { display: flex; justify-content: center; align-items: flex-start; }

        .container {
            width: 100%; max-width: 650px; min-height: 100dvh; background: var(--card-bg);
            padding: 1rem; display: flex; flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .mobile-header-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 0.6rem; border-bottom: 2px solid var(--border); margin-bottom: 0.6rem;
        }
        .mobile-header-bar h1 { font-size: 1.1rem; font-weight: 800; }
        .header-btn-group { display: flex; gap: 0.3rem; align-items: center; }
        .btn-icon { padding: 0.4rem 0.55rem; font-size: 0.78rem; font-weight: 700; background-color: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; text-decoration: none; color: var(--text); display: inline-flex; align-items: center; }
        .btn-fast-highlight { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
        .btn-trip { background-color: #003580; color: white; border: none; }

        /* UI 메뉴 언어 선택 드롭다운 */
        .ui-lang-select { padding: 0.35rem 0.4rem; font-size: 0.75rem; font-weight: 700; border-radius: 6px; border: 1px solid var(--border); background: white; }

        .mode-banner {
            background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af;
            padding: 0.45rem 0.75rem; border-radius: 8px; font-size: 0.78rem; font-weight: 700;
            margin-bottom: 0.6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .partner-lang-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: #f8fafc; border: 1px solid var(--border); border-radius: 8px;
            padding: 0.5rem 0.75rem; margin-bottom: 0.6rem;
        }
        .partner-lang-bar label { font-size: 0.85rem; font-weight: 700; color: #334155; }
        .lang-select-sm { padding: 0.35rem 0.5rem; font-size: 0.82rem; font-weight: 700; border-radius: 6px; border: 1px solid var(--border); background: white; }

        /* 💡 옵션 조절이 가능한 대화창 (기본 약 5줄 표시) */
        .chat-history-box {
            flex: none; height: 220px; overflow-y: auto;
            border: 2px solid var(--border); border-radius: 10px; padding: 0.75rem;
            background: #fafafa; margin-bottom: 0.6rem; display: flex; flex-direction: column; gap: 0.6rem;
            transition: height 0.3s ease;
        }

        .chat-bubble { max-width: 88%; padding: 0.6rem 0.85rem; border-radius: 10px; font-size: 0.9rem; line-height: 1.4; }
        .chat-me { align-self: flex-end; background: var(--my-bubble); color: #1e3a8a; border-bottom-right-radius: 2px; }
        .chat-partner { align-self: flex-start; background: var(--partner-bubble); color: #0f172a; border-bottom-left-radius: 2px; border: 1px solid var(--border); }
        .chat-meta { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.2rem; font-weight: 700; }
        .chat-trans { margin-top: 0.35rem; padding-top: 0.35rem; border-top: 1px dashed #cbd5e1; font-size: 0.85rem; color: #1e293b; }
        .btn-tts { margin-top: 0.35rem; padding: 0.2rem 0.45rem; font-size: 0.72rem; font-weight: 700; background: white; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }

        /* 입력 및 다국어 번역 결과 영역 */
        textarea { width: 100%; height: 75px; padding: 0.6rem; border: 2px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; resize: none; }
        .stt-speak-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin-top: 0.4rem; }
        .btn-speak-me { padding: 0.65rem; font-size: 0.85rem; font-weight: 700; background-color: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-speak-partner { padding: 0.65rem; font-size: 0.85rem; font-weight: 700; background-color: #059669; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-reset { width: 100%; padding: 0.35rem; margin-top: 0.3rem; background: transparent; border: none; color: var(--text-muted); font-size: 0.78rem; text-decoration: underline; cursor: pointer; }

        /* 💡 복원 및 확장된 하단 다국어 번역 및 분석 창 */
        .live-translation-panel {
            margin-top: 0.6rem; padding: 0.75rem; background: #f1f5f9; border: 1px solid var(--border); border-radius: 10px;
        }
        .live-trans-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; font-size: 0.82rem; font-weight: 700; color: #334155; }
        .live-trans-body { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem; font-size: 0.88rem; min-height: 48px; line-height: 1.45; word-break: break-all; }
        .live-trans-tools { display: flex; justify-content: flex-end; gap: 0.4rem; margin-top: 0.4rem; }
        .btn-sub-tool { padding: 0.25rem 0.5rem; font-size: 0.72rem; font-weight: 700; background: white; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }

        .controls { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; margin-top: 0.5rem; }
        .rate-control { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; font-weight: 700; }

        /* 푸터 저작권 표기 */
        .copyright-bar { text-align: center; margin-top: 0.6rem; font-size: 0.72rem; color: var(--text-muted); font-weight: 700; }

        /* 모달 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 14px; width: 92%; max-width: 500px; max-height: 85vh; display: flex; flex-direction: column; padding: 1rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
        .close-btn { font-size: 1.4rem; cursor: pointer; font-weight: 700; }
        .modal-body { padding: 0.8rem 0; overflow-y: auto; flex: 1; }

        .fast-trans-area { width: 100%; height: 110px; padding: 0.6rem; border: 2px solid var(--border); border-radius: 8px; font-size: 0.88rem; margin-bottom: 0.5rem; outline: none; }
        .fast-result-box { width: 100%; min-height: 110px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem; font-size: 0.88rem; line-height: 1.45; white-space: pre-wrap; word-break: break-all; }
        .btn-fast-exec { width: 100%; padding: 0.65rem; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.98rem; cursor: pointer; margin-bottom: 0.6rem; }
        
        .setting-item { margin-bottom: 0.8rem; display: flex; flex-direction: column; gap: 0.35rem; }
        .large-select { padding: 0.55rem; font-size: 0.85rem; font-weight: 700; border-radius: 8px; border: 1px solid var(--border); background: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="mobile-header-bar">
        <h1 id="uiTitle">🗣️ 6개국어 대화 번역기</h1>
        <div class="header-btn-group">
            <!-- UI 언어 선택 옵션 -->
            <select id="uiLangSelect" class="ui-lang-select" onchange="changeUILanguage(this.value)">
                <option value="ko">🇰🇷 한국어</option>
                <option value="en">🇺🇸 English</option>
                <option value="ja">🇯🇵 日本語</option>
            </select>
            <a href="https://www.trip.com" target="_blank" class="btn-icon btn-trip">✈️ Trip.com</a>
            <button id="btnOpenFastTrans" class="btn-icon btn-fast-highlight">⚡ <span id="uiBtnFast">고속 번역</span></button>
            <button id="btnOpenSettings" class="btn-icon">⚙️ <span id="uiBtnSettings">설정</span></button>
        </div>
    </div>

    <!-- 네트워크 상태 바 -->
    <div id="networkNotice" class="mode-banner">
        🌐 <b>Online 모드 연결됨</b> (실시간 구글 고속 번역 엔진 작동 중)
    </div>

    <!-- 상대방 언어 선택 영역 -->
    <div class="partner-lang-bar">
        <label for="partnerLangSelect" id="uiPartnerLangLabel">🤝 상대방 언어 선택:</label>
        <select id="partnerLangSelect" class="lang-select-sm" onchange="resetChatNotice()">
            <option value="en">English (영어)</option>
            <option value="de">Deutsch (독일어)</option>
            <option value="fr">Français (프랑스어)</option>
            <option value="es">Español (스페인어)</option>
            <option value="ja">日本語 (일본어)</option>
            <option value="ko">한국어 (Korean)</option>
        </select>
    </div>

    <!-- 💡 높이 조절 가능한 대화 창 (기본 약 5줄 표시) -->
    <div id="chatHistory" class="chat-history-box">
        <div class="chat-bubble chat-partner">
            <div class="chat-meta" id="uiNoticeHeader">👋 안내</div>
            <span id="uiNoticeText">상대방 언어를 선택한 후, 아래 입력창을 이용하거나 음성으로 대화를 주고받아 보세요.</span>
        </div>
    </div>

    <div class="input-group">
        <textarea id="inputText" placeholder="전송할 대화 내용을 입력하거나 아래 음성 버튼을 누르세요..." oninput="handleLiveTranslation()"></textarea>

        <div class="stt-speak-grid">
            <button id="uiBtnSpeakMe" class="btn-speak-me" onclick="handleSendMessage('me')">🇰🇷 내가 말하기 (전송)</button>
            <button id="uiBtnSpeakPartner" class="btn-speak-partner" onclick="handleSendMessage('partner')">🌐 상대방이 말하기</button>
        </div>
        <button id="uiBtnReset" class="btn-reset" onclick="clearChat()">🗑️ 대화 내용 초기화</button>
    </div>

    <!-- 💡 복원 및 확장된 하단 다국어 번역 출력 창 -->
    <div class="live-translation-panel">
        <div class="live-trans-header">
            <span id="uiLiveTransTitle">🌐 실시간 다국어 번역 창 (미리보기)</span>
            <select id="liveTargetLang" class="lang-select-sm" style="padding:0.2rem 0.4rem; font-size:0.75rem;" onchange="handleLiveTranslation()">
                <option value="en">Translate to English</option>
                <option value="ko">한국어로 번역</option>
                <option value="ja">日本語に翻訳</option>
                <option value="de">Auf Deutsch</option>
                <option value="fr">En Français</option>
                <option value="es">En Español</option>
            </select>
        </div>
        <div id="liveTransBody" class="live-trans-body">입력한 내용이 실시간으로 다국어로 번역되어 여기에 나타납니다.</div>
        <div class="live-trans-tools">
            <button class="btn-sub-tool" onclick="copyLiveTranslation()">📋 <span id="uiBtnCopy">결과 복사</span></button>
            <button class="btn-sub-tool" onclick="speakLiveTranslation()">🔊 <span id="uiBtnListen">듣기</span></button>
        </div>
    </div>

    <div class="controls">
        <div class="rate-control">
            <label for="rate" id="uiRateLabel">음성 읽기 속도:</label>
            <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('rateValue').textContent = this.value + 'x'">
            <span id="rateValue">1.0x</span>
        </div>
    </div>

    <!-- 저작권 표기 -->
    <div class="copyright-bar">
        © 2026 2.02 AI Multilingual Conversation System. All rights reserved.
    </div>
</div>

<!-- ⚡ 고속 번역 전용 모달 창 -->
<div id="fastTransModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="uiFastModalTitle">⚡ 긴 문장 고속 번역</h3>
            <span id="closeFastTrans" class="close-btn">&times;</span>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label id="uiFastDirLabel">🎯 번역 방향:</label>
                <select id="fastLangPair" class="large-select">
                    <option value="auto|ko">자동 감지 ➡️ 한국어</option>
                    <option value="ko|en">한국어 ➡️ 영어</option>
                    <option value="en|ko">영어 ➡️ 한국어</option>
                    <option value="de|ko">독일어 ➡️ 한국어</option>
                    <option value="fr|ko">프랑스어 ➡️ 한국어</option>
                    <option value="es|ko">스페인어 ➡️ 한국어</option>
                    <option value="ja|ko">일본어 ➡️ 한국어</option>
                </select>
            </div>
            <textarea id="fastInputText" class="fast-trans-area" placeholder="번역할 긴 문장이나 문단을 이곳에 붙여넣으세요..."></textarea>
            <button id="uiBtnExecFast" class="btn-fast-exec" onclick="execFastTranslation()">🚀 고속 번역 실행</button>
            
            <label id="uiFastResultLabel" style="font-size:0.82rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:0.3rem;">번역 결과:</label>
            <div id="fastResultBox" class="fast-result-box">결과가 여기에 표시됩니다.</div>
        </div>
    </div>
</div>

<!-- ⚙️ 환경 설정 모달 -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="uiSettingsTitle">⚙️ 환경 설정</h3>
            <span id="closeSettings" class="close-btn">&times;</span>
        </div>
        <div class="modal-body">
            <!-- 💡 대화창 크기 조절 옵션 -->
            <div class="setting-item">
                <label id="uiChatHeightLabel">📏 대화창 크기 (줄 수 설정):</label>
                <select id="chatHeightSelect" class="large-select" onchange="applyChatHeight(this.value)">
                    <option value="220px">컴팩트 (약 5줄 표시 - 기본)</option>
                    <option value="350px">보통 (약 10줄 표시)</option>
                    <option value="500px">확대 (약 15줄 이상 표시)</option>
                </select>
            </div>
            <div class="setting-item">
                <label id="uiAutoPlayLabel">🔊 자동 읽기 (Auto-Play):</label>
                <select id="autoPlaySelect" class="large-select">
                    <option value="true">켜짐 (번역 완료 시 자동으로 음성 재생)</option>
                    <option value="false">꺼짐 (수동 [🔊 읽기] 버튼 사용)</option>
                </select>
            </div>
        </div>
        <button id="btnSaveSettings" class="btn-primary" style="width:100%; padding:0.75rem; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:700;">저장 및 닫기</button>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
        });
    }

    const synth = window.speechSynthesis;
    const chatHistory = document.getElementById('chatHistory');
    const inputText = document.getElementById('inputText');
    const partnerLangSelect = document.getElementById('partnerLangSelect');
    const networkNotice = document.getElementById('networkNotice');
    const liveTransBody = document.getElementById('liveTransBody');

    const langCodeMap = {

            uiChatHeightLabel: '📏 会話ウィンドウの高さ:',
            uiAutoPlayLabel: '🔊 自動読み上げ:',
            phInput: 'メッセージを入力するか、下の音声ボタンを押してください...'
        }
    };

    function changeUILanguage(lang) {
        const dict = i18nDict[lang] || i18nDict['ko'];
        for (let key in dict) {
            const el = document.getElementById(key);
            if (el) {
                if (key === 'phInput') {
                    inputText.placeholder = dict[key];
                } else {
                    el.textContent = dict[key];
                }
            }
        }
    }

    function applyChatHeight(height) {
        chatHistory.style.height = height;
    }

    function updateOnlineStatus() {
        if (navigator.onLine) {
            networkNotice.style.background = '#eff6ff';
            networkNotice.style.borderColor = '#bfdbfe';
            networkNotice.style.color = '#1e40af';
            networkNotice.innerHTML = '🌐 <b>Online 모드 연결됨</b> (실시간 구글 고속 번역 엔진 작동 중)';
        } else {
            networkNotice.style.background = '#fef2f2';
            networkNotice.style.borderColor = '#fca5a5';
            networkNotice.style.color = '#991b1b';
            networkNotice.innerHTML = '📡 <b>Offline 모드</b> (네트워크 연결을 확인해주세요)';
        }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // 모달 제어
    const settingsModal = document.getElementById('settingsModal');
    const fastTransModal = document.getElementById('fastTransModal');
    
    document.getElementById('btnOpenSettings').onclick = () => settingsModal.style.display = 'flex';
    document.getElementById('closeSettings').onclick = () => settingsModal.style.display = 'none';
    document.getElementById('btnSaveSettings').onclick = () => settingsModal.style.display = 'none';

    document.getElementById('btnOpenFastTrans').onclick = () => fastTransModal.style.display = 'flex';
    document.getElementById('closeFastTrans').onclick = () => fastTransModal.style.display = 'none';

    function speakText(text, langCode = 'ko-KR') {
        if (!synth) return;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = parseFloat(document.getElementById('rate').value);
        utterance.lang = langCode;

        // 한국어 음성이 설치되지 않은 외국인 환경을 위한 예비 고품질 fallback 음성 매핑
        const voices = synth.getVoices();
        const targetVoice = voices.find(v => v.lang.startsWith(langCode.substring(0,2)));
        if (targetVoice) {
            utterance.voice = targetVoice;
        }

        synth.speak(utterance);
    }

    async function translateText(text, sourceLang, targetLang) {
        if (!text.trim()) return '';
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            return data[0].map(item => item[0]).join('');
        } catch (err) {
            console.error(err);
            return '번역 중 오류가 발생했습니다.';
        }
    }

    let liveTimer = null;
    function handleLiveTranslation() {
        clearTimeout(liveTimer);
        liveTimer = setTimeout(async () => {
            const text = inputText.value.trim();
            if (!text) {
                liveTransBody.textContent = '입력한 내용이 실시간으로 다국어로 번역되어 여기에 나타납니다.';
                return;
            }
            const targetLang = document.getElementById('liveTargetLang').value;
            liveTransBody.textContent = '⚡ 번역 중...';
            const res = await translateText(text, 'auto', targetLang);
            liveTransBody.textContent = res;
        }, 300);
    }

    function copyLiveTranslation() {
        const text = liveTransBody.textContent;
        if (text && text !== '입력한 내용이 실시간으로 다국어로 번역되어 여기에 나타납니다.') {
            navigator.clipboard.writeText(text);
            alert('복사되었습니다.');
        }
    }

    function speakLiveTranslation() {
        const text = liveTransBody.textContent;
        const targetLang = document.getElementById('liveTargetLang').value;
        if (text && text !== '입력한 내용이 실시간으로 다국어로 번역되어 여기에 나타납니다.') {
            speakText(text, langCodeMap[targetLang] || 'en-US');
        }
    }

    async function handleSendMessage(sender) {
        const text = inputText.value.trim();
        if (!text) return;

        const partnerLang = partnerLangSelect.value;
        let sourceLang = 'ko';
        let targetLang = partnerLang;
        let bubbleClass = 'chat-me';
        let senderTitle = '🇰🇷 나';
        let ttsLang = langCodeMap[partnerLang];

        if (sender === 'partner') {
            sourceLang = partnerLang;
            targetLang = 'ko';
            bubbleClass = 'chat-partner';
            senderTitle = `🌐 상대방 (${partnerLang.toUpperCase()})`;
            ttsLang = 'ko-KR';
        }

        const translated = await translateText(text, sourceLang, targetLang);
        
        appendChatBubble(senderTitle, text, translated, bubbleClass, ttsLang);
        inputText.value = '';
        liveTransBody.textContent = '입력한 내용이 실시간으로 다국어로 번역되어 여기에 나타납니다.';

        if (document.getElementById('autoPlaySelect').value === 'true') {
            speakText(translated, ttsLang);
        }
    }

    function appendChatBubble(sender, original, translated, className, ttsLang) {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${className}`;

        const content = `
            <div class="chat-meta">${sender}</div>
            <div>${original}</div>
            <div class="chat-trans">💬 <b>번역:</b> ${translated}</div>
            <button class="btn-tts" onclick="speakText('${translated.replace(/'/g, "\\'")}', '${ttsLang}')">🔊 읽기</button>
        `;

        bubble.innerHTML = content;
        chatHistory.appendChild(bubble);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    async function execFastTranslation() {
        const text = document.getElementById('fastInputText').value;
        const resultBox = document.getElementById('fastResultBox');
        const pair = document.getElementById('fastLangPair').value.split('|');
        const sourceLang = pair[0];
        const targetLang = pair[1];

        if (!text.trim()) {
            resultBox.textContent = '번역할 내용을 입력해주세요.';
            return;
        }

        resultBox.textContent = '⚡ 고속 번역 처리 중...';
        const translated = await translateText(text, sourceLang, targetLang);
        resultBox.textContent = translated;
    }

    function resetChatNotice() {
        const currentLang = document.getElementById('uiLangSelect').value;
        const dict = i18nDict[currentLang] || i18nDict['ko'];
        chatHistory.innerHTML = `
            <div class="chat-bubble chat-partner">
                <div class="chat-meta">${dict.uiNoticeHeader}</div>
                ${dict.uiNoticeText}
            </div>
        `;
    }

    function clearChat() {
        const currentLang = document.getElementById('uiLangSelect').value;
        const dict = i18nDict[currentLang] || i18nDict['ko'];
        chatHistory.innerHTML = `
            <div class="chat-bubble chat-partner">
                <div class="chat-meta">${dict.uiNoticeHeader}</div>
                ${dict.uiNoticeText}
            </div>
        `;
    }
</script>
</body>
</html>
