<!DOCTYPE html>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="docTitle">🗣️ 6개국어 번역기 v2.0</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --highlight: #dbeafe;
            --highlight-border: #2563eb;
            --tag-en-bg: #e0e7ff;
            --tag-en-color: #3730a3;
            --tag-ko-bg: #fef3c7;
            --tag-ko-color: #92400e;
            --tag-ja-bg: #ffe4e6;
            --tag-ja-color: #9f1239;
            --tag-de-bg: #f3e8ff;
            --tag-de-color: #6b21a8;
            --tag-fr-bg: #e0f2fe;
            --tag-fr-color: #075985;
            --tag-es-bg: #ffedd5;
            --tag-es-color: #9a3412;
            --record-bg: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
         //   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         //   -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            width: 100%;
            max-width: 600px;
            min-height: 100dvh;
            background: var(--card-bg);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .mobile-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 0.75rem;
        }

        .mobile-header-bar h1 {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .header-btn-group {
            display: flex;
            gap: 0.4rem;
        }

        .btn-icon {
            padding: 0.4rem 0.7rem;
            font-size: 0.85rem;
            font-weight: 700;
            background-color: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }

        .log-status-bar {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .status-tag {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: white;
        }
        .status-tag.on { background-color: #16a34a; }
        .status-tag.off { background-color: #94a3b8; }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }
        label { font-weight: 700; font-size: 0.95rem; }

        .stt-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .btn-stt {
            padding: 0.65rem 0.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            background-color: #059669;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 0.8rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.05rem;
            line-height: 1.5;
            outline: none;
            resize: vertical;
        }

        .photo-trans-bar { margin: 0.5rem 0; }
        .btn-photo {
            display: block;
            text-align: center;
            padding: 0.7rem;
            background-color: #4f46e5;
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }

        .ocr-status-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 0.3rem;
            text-align: center;
        }

        .controls, .rec-controls {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .main-controls { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 0.4rem; }
        .btn-large { padding: 0.7rem 0.4rem; font-size: 0.9rem; font-weight: 700; cursor: pointer; }

        .btn-primary { background-color: var(--primary); color: white; border: none; border-radius: 8px; }
        .btn-secondary { background-color: white; color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
        .btn-danger { background-color: var(--record-bg); color: white; border: none; border-radius: 8px; }

        .rate-control { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.9rem; font-weight: 700; }

        .list-header-row { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.4rem; }
        .scroll-control-group { display: flex; gap: 0.4rem; }

        .btn-scroll {
            flex: 1;
            padding: 0.5rem 0.2rem;
            font-size: 0.85rem;
            font-weight: 700;
            background: white;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-scroll.highlight { background: var(--primary); color: white; }

        .scrollable-sentence-box {
            max-height: 260px;
            overflow-y: auto;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem;
            background: #ffffff;
            scroll-behavior: smooth;
        }

        .sentence-card {
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 0.5rem;
            background: #f8fafc;
        }

        .sentence-card.active {
            background-color: var(--highlight);
            border: 2px solid var(--highlight-border);
        }

        .sentence-text { font-size: 1.05rem; font-weight: 700; line-height: 1.4; }
        .translation-block { margin-top: 0.4rem; padding-top: 0.4rem; border-top: 1px dashed var(--border); }
        .translation-text { font-size: 0.95rem; color: #1e293b; line-height: 1.4; }

        .single-play-group {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            margin-top: 0.4rem;
        }

        .btn-lang-play {
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 700;
            background-color: #eff6ff;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 6px;
            cursor: pointer;
        }

        .play-single-btn {
            background: transparent;
            border: none;
            font-size: 1.1rem;
            color: var(--primary);
            cursor: pointer;
        }

        .lang-tag { font-size: 0.7rem; font-weight: 800; padding: 0.15rem 0.35rem; border-radius: 4px; }
        .lang-tag.en { background: var(--tag-en-bg); color: var(--tag-en-color); }
        .lang-tag.ko { background: var(--tag-ko-bg); color: var(--tag-ko-color); }
        .lang-tag.ja { background: var(--tag-ja-bg); color: var(--tag-ja-color); }
        .lang-tag.de { background: var(--tag-de-bg); color: var(--tag-de-color); }
        .lang-tag.fr { background: var(--tag-fr-bg); color: var(--tag-fr-color); }
        .lang-tag.es { background: var(--tag-es-bg); color: var(--tag-es-color); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 92%;
            max-width: 480px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 1.2rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border); }
        .close-btn { font-size: 1.6rem; cursor: pointer; }
        .modal-body { padding: 0.8rem 0; overflow-y: auto; flex: 1; }

        .setting-item { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.3rem; }
        .setting-item.horizontal { flex-direction: row; justify-content: space-between; align-items: center; }

        .large-select { padding: 0.6rem; font-size: 1rem; font-weight: 700; border-radius: 8px; border: 1px solid var(--border); background: white; }

        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background:#ccc; transition:.3s; border-radius:24px; }
        .slider:before { position: absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:white; transition:.3s; border-radius:50%; }
        input:checked + .slider { background: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        .trip-affiliate-card {
            margin-top: auto;
            padding: 0.8rem;
            background: linear-gradient(135deg, #287dfa 0%, #1052c5 100%);
            border-radius: 12px; color: white; display: flex; flex-direction: column; gap: 0.5rem; text-align: center;
        }

        .btn-trip { background-color: #ff9500; color: white; text-decoration: none; font-weight: 700; padding: 0.6rem; border-radius: 8px; }
        footer { margin-top: 0.8rem; text-align: center; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <div class="mobile-header-bar">
        <h1 id="uiTitle">🗣️ 6개국어 번역기</h1>
        <div class="header-btn-group">
            <button id="btnOpenSettings" class="btn-icon">⚙️ 설정</button>
            <button id="btnManageLogs" class="btn-icon">📜 기록</button>
        </div>
    </div>

    <div class="log-status-bar">
        <span id="uiLogBarText">📝 대화 기록 모드:</span>
        <span id="logModeStatus" class="status-tag off">OFF</span>
    </div>

    <div class="input-group">
        <div class="label-row">
            <label for="inputText" id="uiLabelInput">연습할 문장 입력 (큰 글씨 지원):</label>
            <button id="btnClear" class="btn-secondary">🗑️ 지우기</button>
        </div>

        <div class="stt-btn-grid">
            <button id="btnSTTEn" class="btn-stt">🎤 English</button>
            <button id="btnSTTKo" class="btn-stt">🎤 한국어</button>
            <button id="btnSTTJa" class="btn-stt">🎤 日本語</button>
            <button id="btnSTTDe" class="btn-stt">🎤 Deutsch</button>
            <button id="btnSTTFr" class="btn-stt">🎤 Français</button>
            <button id="btnSTTEs" class="btn-stt">🎤 Español</button>
        </div>

        <textarea id="inputText" placeholder=""></textarea>

        <div class="photo-trans-bar">
            <label for="imageInput" id="uiLabelPhoto" class="btn-photo">📷 사진 속 글자 읽기 및 번역</label>
            <input type="file" id="imageInput" accept="image/*" style="display:none;">
            <div id="ocrStatus" class="ocr-status-text"></div>
        </div>
    </div>

    <div class="controls">
        <div class="btn-group main-controls">
            <button id="btnPlay" class="btn-primary btn-large">▶ 전체 읽기</button>
            <button id="btnPause" class="btn-secondary btn-large">⏸️ 일시정지</button>
            <button id="btnStop" class="btn-secondary btn-large">⏹️ 정지</button>
        </div>

        <div class="rate-control">
            <label for="rate" id="uiLabelSpeed">읽기 속도:</label>
            <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1.0">
            <span id="rateValue">1.0x</span>
        </div>
    </div>

    <div class="rec-controls">
        <div class="btn-group" style="display:grid; grid-template-columns: 1fr 1fr; gap:0.4rem;">
            <button id="btnRecStart" class="btn-danger">🎙️ 내 발음 녹음 시작</button>
            <button id="btnRecStop" class="btn-secondary" disabled>⏹️ 녹음 정지</button>
        </div>
        <audio id="audioPlayback" controls style="display:none; width:100%; margin-top:0.5rem;"></audio>
        <a id="btnDownload" class="btn-primary" style="display:none; text-decoration:none; text-align:center; padding:0.5rem; margin-top:0.4rem; font-weight:700;">💾 녹음 저장</a>
    </div>

    <div class="sentences-container">
        <div class="list-header-row">
            <label id="uiLabelList">분석 및 번역 문장 목록:</label>
            <div class="scroll-control-group">
                <button id="btnScrollPrev" class="btn-scroll">▲ 이전 줄</button>
                <button id="btnScrollNext" class="btn-scroll">▼ 다음 줄</button>
                <button id="btnAutoScrollToggle" class="btn-scroll highlight">🔄 연속 넘김</button>
            </div>
        </div>

        <div id="sentenceList" class="scrollable-sentence-box"></div>
    </div>

    <div class="trip-affiliate-card">
        <div class="trip-info">
            <h4 id="uiTripTitle">✈️ Trip.com 특별 혜택</h4>
            <p id="uiTripDesc">전 세계 호텔, 항공권을 최저가로 예약하세요!</p>
        </div>
        <a href="https://www.trip.com/t/77sfZ47lEW2" target="_blank" rel="noopener noreferrer" class="btn-trip" id="uiTripBtn">
            Trip.com 바로가기 ➔
        </a>
    </div>

    <footer>
        <p>Web Speech API & Google Translate | v2.0 (c) Evergreen 2026</p>
    </footer>
</div>

<!-- 환경설정 모달 -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="uiModalSettingsTitle">⚙️ 환경 설정 (옵션)</h3>
            <span id="closeSettingsModal" class="close-btn">&times;</span>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label id="uiLangLabel">🌐 메뉴 언어 선택:</label>
                <select id="uiLangSelect" class="large-select">
                    <option value="ko">한국어 (Korean)</option>
                    <option value="en">English</option>
                    <option value="ja">日本語 (Japanese)</option>
                    <option value="de">Deutsch (German)</option>
                    <option value="fr">Français (French)</option>
                    <option value="es">Español (Spanish)</option>
                </select>
            </div>

            <div class="setting-item horizontal">
                <span id="uiLabelShowTrans">번역문 화면 표시:</span>
                <label class="switch">
                    <input type="checkbox" id="toggleTrans" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item horizontal">
                <span id="uiLabelSingleMode">🔂 문장별 단독 재생 (자동 넘김 방지):</span>
                <label class="switch">
                    <input type="checkbox" id="toggleSingleMode">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <label id="uiLabelTransLang1">번역 언어 1:</label>
                <select id="transLangSelect1" class="large-select">
                    <option value="ko">한국어 (Korean)</option>
                    <option value="en">English</option>
                    <option value="ja">日本語 (Japanese)</option>
                    <option value="de">Deutsch (German)</option>
                    <option value="fr">Français (French)</option>
                    <option value="es">Español (Spanish)</option>
                </select>
            </div>

            <div class="setting-item">
                <label id="uiLabelTransLang2">번역 언어 2:</label>
                <select id="transLangSelect2" class="large-select">
                    <option value="en">English</option>
                    <option value="ko">한국어 (Korean)</option>
                    <option value="ja">日本語 (Japanese)</option>
                    <option value="de">Deutsch (German)</option>
                    <option value="fr">Français (French)</option>
                    <option value="es">Español (Spanish)</option>
                    <option value="none">사용 안 함 (None)</option>
                </select>
            </div>

            <div class="setting-item horizontal">
                <span id="uiLabelLogMode">📝 대화 자동 기록 모드:</span>
                <label class="switch">
                    <input type="checkbox" id="toggleLogMode">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button id="btnSaveSettings" class="btn-primary btn-large" style="width:100%;">설정 완료 및 닫기</button>
        </div>
    </div>
</div>

<!-- 기록 보관함 모달 -->
<div id="logModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="uiModalLogTitle">📜 대화 기록 보관함</h3>
            <span id="closeLogModal" class="close-btn">&times;</span>
        </div>
        <div class="modal-body">
            <div id="logHistoryList"></div>
        </div>
        <div class="modal-footer" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:0.4rem;">
            <button id="btnExportLogs" class="btn-secondary">💾 백업</button>
            <button id="btnImportLogs" class="btn-secondary">📁 열기</button>
            <input type="file" id="logFileInput" accept=".json" style="display: none;">
            <button id="btnClearAllLogs" class="btn-danger">🗑️ 삭제</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" async></script>
<script>
// 보안 처리
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && [85, 83].includes(e.keyCode))) {
        e.preventDefault(); return false;
    }
});

// 사진 OCR (6개국어 언어팩 지원)
imageInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    ocrStatus.textContent = "📷 분석 중...";
    let worker = null;
    try {
        if (typeof Tesseract === 'undefined') {
            alert("OCR 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.");
            ocrStatus.textContent = "";
            return;
        }
        worker = await Tesseract.createWorker('eng+kor+jpn+deu+fra+spa');
        const ret = await worker.recognize(file);

        const text = ret.data.text.trim();
        if (text) {
            inputText.value = inputText.value ? `${inputText.value}\n\n${text}` : text;
            ocrStatus.textContent = "✅ 완료!";
            appendToCurrentLog(text, "PHOTO_OCR");
            saveCurrentState();
            renderSentences();
        } else {
            ocrStatus.textContent = "❌ 글자 인식 실패";
        }
    } catch (err) {
        ocrStatus.textContent = "❌ 분석 오류";
    } finally {
        if (worker) await worker.terminate();
    }
});

// 기록 관리
function getLocalLogs() { return JSON.parse(localStorage.getItem('app_dialogue_logs') || '[]'); }
function saveLocalLogs(logs) { localStorage.setItem('app_dialogue_logs', JSON.stringify(logs)); }

function appendToCurrentLog(text, sourceLang) {
    if (!isLogModeOn || !text.trim()) return;
    let logs = getLocalLogs();
    const today = new Date().toISOString().split('T')[0];
    let todayLog = logs.find(item => item.date === today);

    if (!todayLog) {
        todayLog = { id: Date.now(), date: today, entries: [] };
        logs.push(todayLog);
    }

    todayLog.entries.push({ time: new Date().toLocaleTimeString(), sourceLang, text });
    saveLocalLogs(logs);
}

toggleLogMode.addEventListener('change', (e) => {
    isLogModeOn = e.target.checked;
    logModeStatus.textContent = isLogModeOn ? "ON" : "OFF";
    logModeStatus.className = isLogModeOn ? "status-tag on" : "status-tag off";
});

function renderLogHistory() {
    const logs = getLocalLogs();
    const logHistoryList = document.getElementById('logHistoryList');
    logHistoryList.innerHTML = '';

    if (logs.length === 0) {
        logHistoryList.innerHTML = '<p style="text-align:center; color:#64748b; padding:1rem;">기록이 없습니다.</p>';
        return;
    }

    logs.forEach((logItem, index) => {
        const itemCard = document.createElement('div');
        itemCard.style.cssText = "background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px; padding:0.8rem; margin-bottom:0.75rem;";
        let entriesHtml = logItem.entries.map(e => `<div>• <b>[${e.time}] (${e.sourceLang}):</b> ${e.text}</div>`).join('');

        itemCard.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem; font-size:0.85rem; color:#475569;">
                <span><b>📅 ${logItem.date}</b> (${logItem.entries.length}개)</span>
                <div>
                    <button onclick="loadLogToInput(${index})" style="padding:0.2rem 0.5rem;">불러오기</button>
                    <button onclick="deleteSingleLog(${index})" style="padding:0.2rem 0.5rem; background:#dc2626; color:white; border:none; border-radius:4px;">삭제</button>
                </div>
            </div>
            <div style="font-size:0.9rem; max-height:100px; overflow-y:auto; background:white; padding:0.5rem; border-radius:4px;">
                ${entriesHtml}
            </div>
        `;
        logHistoryList.appendChild(itemCard);
    });
}

window.loadLogToInput = function(index) {
    const logs = getLocalLogs();
    if (logs[index]) {
        inputText.value = logs[index].entries.map(e => e.text).join('\n');
        renderSentences();
        logModal.style.display = 'none';
    }
};

window.deleteSingleLog = function(index) {
    if (confirm("이 기록을 삭제하시겠습니까?")) {
        let logs = getLocalLogs();
        logs.splice(index, 1);
        saveLocalLogs(logs);
        renderLogHistory();
    }
};

logFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
        try {
            const imported = JSON.parse(evt.target.result);
            if (Array.isArray(imported)) {
                saveLocalLogs(imported);
                renderLogHistory();
                alert("불러오기 완료!");
            }
        } catch (err) { alert("유효하지 않은 파일입니다."); }
    };
    reader.readAsText(file);
});

// 메뉴 번역 기본 세팅
function applyMenuTranslationRules(menuLang) {
    if (menuLang === 'ko') { transLangSelect1.value = 'ko'; transLangSelect2.value = 'en'; }
    else if (menuLang === 'ja') { transLangSelect1.value = 'ja'; transLangSelect2.value = 'en'; }
    else if (menuLang === 'en') { transLangSelect1.value = 'en'; transLangSelect2.value = 'ko'; }
    else if (menuLang === 'de') { transLangSelect1.value = 'de'; transLangSelect2.value = 'en'; }
    else if (menuLang === 'fr') { transLangSelect1.value = 'fr'; transLangSelect2.value = 'en'; }
    else if (menuLang === 'es') { transLangSelect1.value = 'es'; transLangSelect2.value = 'en'; }
}

function loadSavedState() {
    const hasVisited = localStorage.getItem('app_has_visited');
    const savedText = localStorage.getItem('app_input_text');

    if (!hasVisited) {
        inputText.value = langRes.demoText;
        localStorage.setItem('app_has_visited', 'true');
        localStorage.setItem('app_input_text', inputText.value);
        applyMenuTranslationRules(currentLang);
    } else {
        if (savedText !== null) inputText.value = savedText;
        const savedLang1 = localStorage.getItem('app_trans_lang1');
        const savedLang2 = localStorage.getItem('app_trans_lang2');

        if (savedLang1) transLangSelect1.value = savedLang1;
        else applyMenuTranslationRules(currentLang);

        if (savedLang2) transLangSelect2.value = savedLang2;
    }

    const savedShowTrans = localStorage.getItem('app_show_trans');
    if (savedShowTrans !== null && toggleTrans) toggleTrans.checked = (savedShowTrans === 'true');

    const savedSingleMode = localStorage.getItem('app_single_mode');
    if (savedSingleMode !== null && toggleSingleMode) toggleSingleMode.checked = (savedSingleMode === 'true');
}

function saveCurrentState() {
    localStorage.setItem('app_input_text', inputText.value);
    localStorage.setItem('app_ui_lang', currentLang);
    if (toggleTrans) localStorage.setItem('app_show_trans', toggleTrans.checked);
    if (toggleSingleMode) localStorage.setItem('app_single_mode', toggleSingleMode.checked);
    localStorage.setItem('app_trans_lang1', transLangSelect1.value);
    localStorage.setItem('app_trans_lang2', transLangSelect2.value);
}

    document.getElementById('btnExportLogs').textContent = langRes.btnExport;
    document.getElementById('btnImportLogs').textContent = langRes.btnImport;
    document.getElementById('btnClearAllLogs').textContent = langRes.btnClearAll;

    document.getElementById('uiTripTitle').textContent = langRes.tripTitle;
    document.getElementById('uiTripDesc').textContent = langRes.tripDesc;
    document.getElementById('uiTripBtn').textContent = langRes.tripBtn;

    btnClear.textContent = langRes.btnClear;
    btnSTTEn.textContent = langRes.btnSTTEn;
    btnSTTKo.textContent = langRes.btnSTTKo;
    btnSTTJa.textContent = langRes.btnSTTJa;
    btnSTTDe.textContent = langRes.btnSTTDe;
    btnSTTFr.textContent = langRes.btnSTTFr;
    btnSTTEs.textContent = langRes.btnSTTEs;

    btnPlay.textContent = isPlaying ? langRes.btnPlayActive : langRes.btnPlay;
    btnPause.textContent = langRes.btnPause;
    btnStop.textContent = langRes.btnStop;
    btnRecStart.textContent = langRes.btnRecStart;
    btnRecStop.textContent = langRes.btnRecStop;
    btnDownload.textContent = langRes.btnDownload;

    inputText.placeholder = langRes.placeholder;
    saveCurrentState();
    renderSentences();
}

uiLangSelect.value = currentLang;
uiLangSelect.addEventListener('change', (e) => updateLanguage(e.target.value, true));

btnClear.addEventListener('click', () => {
    inputText.value = "";
    stopPlayback();
    saveCurrentState();
    renderSentences();
});

let sentences = [];
let currentIndex = 0;
let isPlaying = false;
let synth = window.speechSynthesis;
let voices = [];
let mediaRecorder = null;
let audioChunks = [];
let currentSpeechRecognition = null;

// 언어 정규식 감지 패턴 (6개국어)
const regEnglish = /[a-zA-Z]/;
const regKorean = /[\u3131-\u318E\uAC00-\uD7A3]/;
const regJapanese = /[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/;
const regGerman = /[äöüÄÖÜß]/;
const regFrench = /[éèêëàâùûüçîïÔôŒœæÆ]/;
const regSpanish = /[áéíóúüñ¿¡]/;

function detectLanguage(text) {
    if ((text.match(new RegExp(regJapanese, 'g')) || []).length > 0) return 'ja';
    if ((text.match(new RegExp(regKorean, 'g')) || []).length > 0) return 'ko';
    if ((text.match(new RegExp(regGerman, 'g')) || []).length > 0) return 'de';
    if ((text.match(new RegExp(regFrench, 'g')) || []).length > 0) return 'fr';
    if ((text.match(new RegExp(regSpanish, 'g')) || []).length > 0) return 'es';
    
    const enCount = (text.match(new RegExp(regEnglish, 'g')) || []).length;
    if (enCount > 0) return 'en';
    return 'en';
}

function loadVoices() { voices = synth.getVoices(); }
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

function normalizeLangCode(code) {
    if (!code) return 'en-US';
    const clean = code.toString().toLowerCase().trim();
    if (clean.startsWith('en') || clean.includes('english')) return 'en-US';
    if (clean.startsWith('ko') || clean.includes('korean') || clean.includes('한국어')) return 'ko-KR';
    if (clean.startsWith('ja') || clean.includes('japanese') || clean.includes('일본어')) return 'ja-JP';
    if (clean.startsWith('de') || clean.includes('deutsch') || clean.includes('독일어')) return 'de-DE';
    if (clean.startsWith('fr') || clean.includes('french') || clean.includes('불어')) return 'fr-FR';
    if (clean.startsWith('es') || clean.includes('spanish') || clean.includes('서반아어')) return 'es-ES';
    return 'en-US';
}

function getBestVoice(langCode) {
    if (!voices || voices.length === 0) voices = synth.getVoices();
    const targetTag = normalizeLangCode(langCode);
    const prefix = targetTag.split('-')[0];

    let matched = voices.filter(v => v.lang.replace('_', '-').toLowerCase() === targetTag.toLowerCase());
    if (matched.length === 0) {
        matched = voices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(prefix));
    }

    if (matched.length === 0) return null;
    const best = matched.find(v => v.name.includes('Natural') || v.name.includes('Online') || v.name.includes('Google'));
    return best || matched[0];
}

async function translateText(text, targetLang) {
    if (!targetLang || targetLang === 'none') return "";
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0].map(item => item[0]).join('');
    } catch (e) { return ""; }
}

function parseSentences(text) {
    if (!text.trim()) return [];
    const rawSegments = text.split(/(?<=[.!?;\n。！？；])\s+/);
    let parsed = [];

    for (let seg of rawSegments) {
        seg = seg.trim();
        if (!seg) continue;
        const chunks = seg.match(/([a-zA-ZäöüÄÖÜßéèêëàâùûüçîïÔôŒœæÆáéíóúñ¿¡0-9\s'\",.-]+|[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF\s、。]+|[\uAC00-\uD7A3\u3131-\u318E\s]+|[^a-zA-Z0-9\uAC00-\uD7A3\u3131-\u318E\u3040-\u309F\u30A0-\u30FF]+)/g) || [seg];
        let tempGroup = "";
        let lastLang = null;

        for (let chunk of chunks) {
            if (!chunk.trim()) continue;
            let lang = detectLanguage(chunk);
            if (lastLang === null || lastLang === lang) tempGroup += chunk;
            else {
                if (tempGroup.trim()) parsed.push(createSentenceObj(tempGroup.trim(), lastLang));
                tempGroup = chunk;
            }
            lastLang = lang;
        }
        if (tempGroup.trim()) parsed.push(createSentenceObj(tempGroup.trim(), lastLang));
    }
    return parsed;
}

function createSentenceObj(text, langCode) {
    return { text, langCode, lang: normalizeLangCode(langCode), translation1: '', translation2: '' };
}

async function renderSentences() {
    sentences = parseSentences(inputText.value);
    
    const showTrans = toggleTrans ? toggleTrans.checked : true;
    const isSingleMode = toggleSingleMode ? toggleSingleMode.checked : false;
    const targetLang1 = transLangSelect1 ? transLangSelect1.value : 'ko';
    const targetLang2 = transLangSelect2 ? transLangSelect2.value : 'en';

    if (showTrans) {
        await Promise.all(sentences.map(async (item) => {
            if (targetLang1 !== item.langCode) item.translation1 = await translateText(item.text, targetLang1);
            if (targetLang2 !== 'none' && targetLang2 !== item.langCode) item.translation2 = await translateText(item.text, targetLang2);
        }));
    }

    const fragment = document.createDocumentFragment();

    for (let index = 0; index < sentences.length; index++) {
        const item = sentences[index];
        const card = document.createElement('div');
        card.className = `sentence-card ${index === currentIndex && isPlaying ? 'active' : ''}`;
        card.id = `card-${index}`;

        let tagLabel = langRes.tagEn;
        if (item.langCode === 'ko') tagLabel = langRes.tagKo;
        if (item.langCode === 'ja') tagLabel = langRes.tagJa;
        if (item.langCode === 'de') tagLabel = langRes.tagDe;
        if (item.langCode === 'fr') tagLabel = langRes.tagFr;
        if (item.langCode === 'es') tagLabel = langRes.tagEs;

        let trans1Tag = langRes[`tag${targetLang1.charAt(0).toUpperCase() + targetLang1.slice(1)}`] || targetLang1;
        let trans2Tag = langRes[`tag${targetLang2.charAt(0).toUpperCase() + targetLang2.slice(1)}`] || targetLang2;

        let playControlsHtml = isSingleMode ? `
            <div class="single-play-group">
                <button class="btn-lang-play" onclick="playSingleLanguageText('${encodeURIComponent(item.text)}', '${item.langCode}')">🔊 ${tagLabel}</button>
                ${item.translation1 ? `<button class="btn-lang-play" onclick="playSingleLanguageText('${encodeURIComponent(item.translation1)}', '${targetLang1}')">🔊 ${trans1Tag}</button>` : ''}
                ${item.translation2 ? `<button class="btn-lang-play" onclick="playSingleLanguageText('${encodeURIComponent(item.translation2)}', '${targetLang2}')">🔊 ${trans2Tag}</button>` : ''}
            </div>
        ` : `<button class="play-single-btn" onclick="playSingle(${index})">▶</button>`;

        card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="sentence-text">${item.text}</div>
                <div>
                    <span class="lang-tag ${item.langCode}">${tagLabel}</span>
                    ${!isSingleMode ? playControlsHtml : ''}
                </div>
            </div>
            ${showTrans ? `
                <div class="translation-block">
                    ${item.translation1 ? `<div class="translation-text">💬 <b>${trans1Tag}:</b> ${item.translation1}</div>` : ''}
                    ${item.translation2 ? `<div class="translation-text">💬 <b>${trans2Tag}:</b> ${item.translation2}</div>` : ''}
                </div>
            ` : ''}
            ${isSingleMode ? playControlsHtml : ''}
        `;
        fragment.appendChild(card);
    }

    sentenceList.innerHTML = '';
    sentenceList.appendChild(fragment);
}

// 개별 단독 발음 재생
window.playSingleLanguageText = function(encodedText, langCode) {
    const text = decodeURIComponent(encodedText);
    if (!text || !text.trim()) return;

    synth.cancel();

    const targetLangTag = normalizeLangCode(langCode);
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = targetLangTag;
    utterance.rate = parseFloat(rateInput ? rateInput.value : 1.0);

    const voice = getBestVoice(targetLangTag);
    if (voice) utterance.voice = voice;

    setTimeout(() => {
        synth.speak(utterance);
    }, 50);
};

function updateActiveCard(index) {
    document.querySelectorAll('.sentence-card').forEach((card, i) => {
        if (i === index) {
            card.classList.add('active');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else { card.classList.remove('active'); }
    });
}

function speakUtteranceAsync(text, langCode) {
    return new Promise((resolve) => {
        if (!text || !isPlaying) { resolve(); return; }
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = normalizeLangCode(langCode);
        utterance.rate = parseFloat(rateInput.value);
        const voice = getBestVoice(langCode);
        if (voice) utterance.voice = voice;

        utterance.onend = () => resolve();
        utterance.onerror = () => resolve();

        synth.speak(utterance);
    });
}

async function playNative(index) {
    if (index >= sentences.length || !isPlaying) {
        isPlaying = false; updateActiveCard(-1); btnPlay.textContent = langRes.btnPlay; return;
    }

    synth.cancel();
    currentIndex = index;
    const current = sentences[currentIndex];
    updateActiveCard(currentIndex);

    const showTrans = toggleTrans ? toggleTrans.checked : true;
    const targetLang1 = transLangSelect1.value;
    const targetLang2 = transLangSelect2.value;

    await speakUtteranceAsync(current.text, current.langCode);

    if (isPlaying && showTrans && current.translation1) {
        await speakUtteranceAsync(current.translation1, targetLang1);
    }

    if (isPlaying && showTrans && current.translation2) {
        await speakUtteranceAsync(current.translation2, targetLang2);
    }

    if (isPlaying) {
        currentIndex++;
        playNative(currentIndex);
    }
}

function startPlayback() {
    if (sentences.length === 0) return;
    if (synth.paused) { synth.resume(); isPlaying = true; btnPlay.textContent = langRes.btnPlayActive; return; }
    if (isPlaying) return;
    isPlaying = true;
    btnPlay.textContent = langRes.btnPlayActive;
    playNative(currentIndex);
}

function pausePlayback() { if (synth.speaking && !synth.paused) { synth.pause(); isPlaying = false; btnPlay.textContent = langRes.btnResume; } }
function stopPlayback() { synth.cancel(); isPlaying = false; currentIndex = 0; btnPlay.textContent = langRes.btnPlay; updateActiveCard(-1); }

window.playSingle = function(index) { stopPlayback(); isPlaying = true; btnPlay.textContent = langRes.btnPlayActive; playNative(index); };

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function startSpeechRecognition(langMode, btnElement, sourceLangName) {
    if (!SpeechRecognition) { alert(langRes.errNoSTT); return; }
    
    if (currentSpeechRecognition) {
        try { currentSpeechRecognition.abort(); } catch(e){}
    }

    const recognition = new SpeechRecognition();
    currentSpeechRecognition = recognition;
    recognition.lang = langMode;
    recognition.interimResults = false;

    recognition.onstart = () => {
        btnElement.textContent = langRes.btnSTTListening;
        btnElement.style.opacity = '0.7';
    };

    recognition.onresult = async (event) => {
        const spokenText = event.results[0][0].transcript;
        inputText.value = inputText.value ? `${inputText.value}\n\n${spokenText}` : spokenText;

        appendToCurrentLog(spokenText, sourceLangName);
        resetSTTButtons();
        stopPlayback();
        saveCurrentState();
        await renderSentences();
    };

    recognition.onerror = () => { alert(langRes.errMic); resetSTTButtons(); };
    recognition.onend = () => resetSTTButtons();

    try { recognition.start(); } catch (e) { resetSTTButtons(); }
}

function resetSTTButtons() {
    btnSTTEn.textContent = langRes.btnSTTEn;
    btnSTTKo.textContent = langRes.btnSTTKo;
    btnSTTJa.textContent = langRes.btnSTTJa;
    btnSTTDe.textContent = langRes.btnSTTDe;
    btnSTTFr.textContent = langRes.btnSTTFr;
    btnSTTEs.textContent = langRes.btnSTTEs;

    btnSTTEn.style.opacity = '1.0';
    btnSTTKo.style.opacity = '1.0';
    btnSTTJa.style.opacity = '1.0';
    btnSTTDe.style.opacity = '1.0';
    btnSTTFr.style.opacity = '1.0';
    btnSTTEs.style.opacity = '1.0';
    currentSpeechRecognition = null;
}

btnSTTEn.addEventListener('click', () => startSpeechRecognition('en-US', btnSTTEn, 'EN'));
btnSTTKo.addEventListener('click', () => startSpeechRecognition('ko-KR', btnSTTKo, 'KO'));
btnSTTJa.addEventListener('click', () => startSpeechRecognition('ja-JP', btnSTTJa, 'JA'));
btnSTTDe.addEventListener('click', () => startSpeechRecognition('de-DE', btnSTTDe, 'DE'));
btnSTTFr.addEventListener('click', () => startSpeechRecognition('fr-FR', btnSTTFr, 'FR'));
btnSTTEs.addEventListener('click', () => startSpeechRecognition('es-ES', btnSTTEs, 'ES'));

btnRecStart.addEventListener('click', async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert(langRes.errMic); return; }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            audioPlayback.src = audioUrl; audioPlayback.style.display = 'inline-block';
            btnDownload.href = audioUrl;
            btnDownload.download = `voice_${Date.now()}.webm`;
            btnDownload.style.display = 'inline-block';
        };
        mediaRecorder.start();
        btnRecStart.disabled = true; btnRecStop.disabled = false;
        btnRecStart.textContent = langRes.btnRecRecording;
    } catch (err) { alert(langRes.errMic); }
});

btnRecStop.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop());
        btnRecStart.disabled = false; btnRecStop.disabled = true;
        btnRecStart.textContent = langRes.btnRecStart;
    }
});

inputText.addEventListener('input', () => {
    stopPlayback();
    saveCurrentState();
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => {
        renderSentences();
    }, 400);
});

rateInput.addEventListener('input', e => { rateValue.textContent = `${parseFloat(e.target.value).toFixed(1)}x`; });

btnPlay.addEventListener('click', startPlayback);
btnPause.addEventListener('click', pausePlayback);
btnStop.addEventListener('click', stopPlayback);

// 초기 실행
loadSavedState();
updateLanguage(currentLang, false);
</script>
